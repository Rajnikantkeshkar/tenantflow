spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: TenantFlow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tenantflow}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:50000}

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForJwtGeneration}
